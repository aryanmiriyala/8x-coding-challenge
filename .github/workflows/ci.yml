name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      
      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
          DATABASE_URL_UNPOOLED: postgresql://dummy:dummy@localhost/dummy
          NEON_AUTH_BASE_URL: https://dummy.neonauth.com
          NEON_AUTH_COOKIE_SECRET: 12345678901234567890123456789012
